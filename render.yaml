services:
  - type: web
    name: trading-bot
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: PORT
        value: 8080
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: ATR_PERCENT_MIN
        value: 1.5
      - key: VOLUME_SMA20_MIN
        value: 1000000
      - key: VOL_RANK_OVERHEATED
        value: 90.0
      - key: MAX_TURBO_LEVERAGE
        value: 4.5
